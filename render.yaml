services:
  - type: web
    name: seats-agent-runner
    runtime: node
    plan: free
    rootDir: services/agent-runner
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # NEAR_RPC_FALLBACK_URLS defaults to test.rpc.fastnear.com and rpc.testnet.near.org.
      - key: NEAR_RPC_URL
        value: https://rpc.testnet.fastnear.com
      - key: DAO_ID
        value: seats2-1793847972.sputnikv2.testnet
      - key: VOTERS
        value: /etc/secrets/voters.json
      - key: SEAT_NFT_ID
        value: seatsnft3-1793848334.testnet
      - key: RUNNER_AGENT_KEY_FILE
        value: /etc/secrets/runner-agent.json
      - key: KEEPER_KEY_FILE
        value: /etc/secrets/keeper.json
      - key: KEEPER_ACCOUNT_ID
        sync: false
