[workspace]
members = [
    "contracts/seat-voter",
    "contracts/seat-nft",
    "contracts/tee-verifier",
    "contracts/tests",
]
exclude = ["outlayer/vault-job", "outlayer/agent-job"]
resolver = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"
