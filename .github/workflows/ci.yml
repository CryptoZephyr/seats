name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/agent-runner/package-lock.json
      - name: Test and type-check agent runner
        working-directory: services/agent-runner
        run: npm ci && npm test && npx tsc --noEmit
      - name: Build and smoke-test agent runner runtime
        working-directory: services/agent-runner
        run: |
          npm run build
          set +e
          deploy_output=$(node dist/scripts/deploy-testnet.js 2>&1)
          deploy_status=$?
          runner_output=$(env -i "$(command -v node)" dist/services/agent-runner/src/index.js 2>&1)
          runner_status=$?
          set -e
          if [ "$deploy_status" -ne 1 ] || ! printf '%s\n' "$deploy_output" | grep -Fq 'Usage: deploy-testnet.js'; then
            printf '%s\n' "$deploy_output"
            echo "deploy-testnet runtime smoke test failed"
            exit 1
          fi
          if [ "$runner_status" -ne 1 ] || ! printf '%s\n' "$runner_output" | grep -Fq 'Error: VOTERS is required'; then
            printf '%s\n' "$runner_output"
            echo "agent-runner runtime smoke test failed"
            exit 1
          fi
          if printf '%s\n' "$deploy_output" "$runner_output" | grep -Fq 'exports is not defined'; then
            printf '%s\n' "$deploy_output" "$runner_output"
            echo "agent-runner runtime emitted a module-format error"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32-wasip2
      - name: Test workspace
        run: cargo test --workspace
      - name: Build contract WASM
        run: cargo build --release --target wasm32-unknown-unknown -p seat-voter -p seat-nft -p tee-verifier
      - name: Check test mint is absent from default seat NFT WASM
        run: |
          if strings target/wasm32-unknown-unknown/release/seat_nft.wasm | grep -q 'mint_test_seat'; then
            echo "default seat NFT WASM contains mint_test_seat"
            exit 1
          fi
          if strings target/wasm32-unknown-unknown/release/seat_nft.wasm | grep -Fq 'Test fixture with an externally administered voter'; then
            echo "default seat NFT WASM contains the test fixture description"
            exit 1
          fi
          if strings target/wasm32-unknown-unknown/release/seat_nft.wasm | grep -Fq 'Test seat'; then
            echo "default seat NFT WASM contains the test title"
            exit 1
          fi
          if ! strings target/wasm32-unknown-unknown/release/seat_nft.wasm | grep -F 'A DAO-governed membership seat' >/dev/null; then
            echo "default seat NFT WASM is missing the production seat description"
            exit 1
          fi
      - name: Build sandbox-test seat NFT WASM
        run: cargo build --release --target wasm32-unknown-unknown -p seat-nft --features sandbox-test
      - name: Run Sputnik DAO sandbox integration
        run: cargo test -p seats-integration-tests --test seat_flow -- --ignored
      - name: Build OutLayer WASI jobs
        run: |
          cargo build --release --target wasm32-wasip2 --manifest-path outlayer/vault-job/Cargo.toml
          cargo build --release --target wasm32-wasip2 --manifest-path outlayer/agent-job/Cargo.toml
