[package]
name = "tee-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dcap-qvl = { version = "0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
hex = "0.4"
near-sdk = { version = "=5.24.1", features = ["legacy"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.24.1", features = ["unit-testing", "legacy"] }
