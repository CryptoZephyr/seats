[package]
name = "seat-nft"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[features]
default = []
sandbox-test = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.24.1", features = ["global-contracts", "unstable"] }
near-contract-standards = "=5.24.1"

[dev-dependencies]
near-sdk = { version = "=5.24.1", features = ["global-contracts", "unit-testing", "unstable"] }
